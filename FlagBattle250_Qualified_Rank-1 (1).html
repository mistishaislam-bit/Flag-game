<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>250 Flag Battle - Original Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-align:center}
#top{padding-top:12px;text-shadow:0 2px 8px #000}
h1{font-size:clamp(18px,5vw,32px);margin:0;font-weight:900;letter-spacing:1px}
#count{font-size:14px;margin-top:5px;font-weight:700}
#start{display:none!important;pointer-events:auto;margin-top:10px;border:0;border-radius:24px;padding:10px 22px;font-weight:900;background:#fff;color:#111}
#win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,70px);font-weight:1000;display:none;text-shadow:0 4px 20px #000}
#hint{position:absolute;bottom:12px;left:0;right:0;font-size:11px;opacity:.7}
#qual{position:absolute;top:72px;left:12px;width:min(94vw,430px);background:rgba(13,22,45,.86);border:1px solid rgba(100,150,255,.35);border-radius:12px;padding:7px 9px;box-shadow:0 6px 20px rgba(0,0,0,.35);text-align:left;backdrop-filter:blur(4px)}
#qualTitle{font-size:12px;font-weight:900;letter-spacing:1px;text-align:center;margin-bottom:4px;color:#eaf1ff}
.qrow{display:grid;grid-template-columns:42px 30px 1fr 34px;align-items:center;gap:5px;height:22px;font-size:11px;font-weight:800;border-top:1px solid rgba(255,255,255,.07)}
.qrow:first-of-type{border-top:0}.qrank{opacity:.8}.qflag{font-size:18px;text-align:center}.qname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qwin{color:#ffe45c;text-align:right}
@media(max-width:420px){#qual{top:68px;left:8px;width:calc(100vw - 16px)}#qualTitle{font-size:11px}.qrow{height:20px;font-size:10px}.qflag{font-size:16px}}
</style>

  <div id="win"></div><div id="hint">Original gameplay • Winner voice • Punchy POP sound • No external music</div>
</div>

const cv=document.getElementById("c"),x=cv.getContext("2d"),count=document.getElementById("count"),win=document.getElementById("win"),start=document.getElementById("start"),qualRows=document.getElementById("qualRows");
let qualified=[];
function updateQualified(){
  qualRows.innerHTML=qualified.slice(-5).reverse().map(q=>`<div class="qrow"><span class="qrank">#${q.rank}</span><span class="qflag">${q.f}</span><span class="qname">${countryNames[q.f]||"Unknown"}</span><span class="qwin">WIN</span></div>`).join("");
}
function resetQualified(){qualified=[];updateQualified();}
function recordElimination(b,rank){qualified.push({f:b.f,rank});updateQualified();}
let W,H,cx,cy,R,dpr=1,balls=[],running=false,last=0,elimClock=0,audio;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
 x.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2+12;R=Math.min(W,H)*.41;
}
function tone(freq=180,dur=.08,vol=.10,type="sine"){
 try{
  if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
  audio.resume();
  const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+dur+.01);
 }catch(e){}
}
function beep(freq=180,dur=.06,vol=.10){ tone(freq,dur,vol,"square"); }
function popSound(){
 try{
  if(window.Android && Android.pop){ Android.pop(); return; }
  if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)(); audio.resume();
  const now=audio.currentTime;
  const o=audio.createOscillator(),g=audio.createGain();o.type="sine";
  o.frequency.setValueAtTime(310,now);o.frequency.exponentialRampToValueAtTime(92,now+.105);
  g.gain.setValueAtTime(.24,now);g.gain.exponentialRampToValueAtTime(.0001,now+.11);
  o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.12);
  // tiny original click layer
  const b=audio.createOscillator(),bg=audio.createGain();b.type="triangle";b.frequency.value=720;
  bg.gain.setValueAtTime(.07,now);bg.gain.exponentialRampToValueAtTime(.0001,now+.035);b.connect(bg);bg.connect(audio.destination);b.start(now);b.stop(now+.04);
 }catch(e){}
}
let musicTimer=null,musicStep=0;
function battleMusic(){
 if(musicTimer) return;
 const notes=[196,233,262,294,330,294,262,233];
 musicTimer=setInterval(()=>{
  if(!audio)return;
  const f=notes[musicStep++%notes.length];
  tone(f,.16,.035,"triangle");
  if(musicStep%4===0) tone(f/2,.20,.022,"sine");
 },280);
}
function startAudio(){
 try{
  if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state!=="running")audio.resume();
  tone(520,.07,.025,"triangle"); battleMusic();
 }catch(e){}
}
function announceWinner(flag){
 const name=countryNames[flag]||"the winning flag";
 try{
  if(window.Android && Android.speak){ Android.speak(name+" wins! "+name+" is the champion!"); return; }
  if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(name+" wins! "+name+" is the champion!");
   u.lang="en-US";u.rate=.82;u.pitch=.95;u.volume=1;speechSynthesis.speak(u);
  }
 }catch(e){}
 // original victory fanfare, synthesized in-browser
 [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,.07,"triangle"),i*120));
}
function newGame(){
 resize();balls=[];running=false;win.style.display="none";start.style.display="none";resetQualified();
 for(let i=0;i<250;i++){
  const a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*(R-17);
  balls.push({f:flags[i%flags.length],x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,r:Math.max(8,Math.min(13,W/55)),
   vx:(Math.random()-.5)*2.6,vy:(Math.random()-.5)*2.6,dead:false,spin:Math.random()*6});
 }
 countdown(3);
}
function countdown(n){
 count.textContent=n>0?("STARTING IN "+n):"BATTLE!";
 if(n>0){beep(240+n*80,.07);setTimeout(()=>countdown(n-1),700)}
 else {running=true;last=performance.now();requestAnimationFrame(loop)}
}
function collide(a,b){
 let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;
 if(d<min){let nx=dx/d,ny=dy/d,rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rel<0){let j=-rel*.88;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny}
  let p=(min-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
 }
}
function eliminate(){
 const alive=balls.filter(b=>!b.dead);if(alive.length<=1)return;
 // remove one of the most central/random flags to create a continuous battle
 const b=alive[(Math.random()*alive.length)|0];
 const rank=alive.length;
 b.dead=true;recordElimination(b,rank);popSound();
 for(let i=0;i<8;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,t:25});
}
let particles=[];
function draw(){
 x.clearRect(0,0,W,H);
 let bg=x.createRadialGradient(cx,cy,10,cx,cy,R*1.4);bg.addColorStop(0,"#20283a");bg.addColorStop(1,"#080b12");
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fillStyle="#111826";x.fill();x.lineWidth=5;x.strokeStyle="#e9eef8";x.stroke();
 x.beginPath();x.arc(cx,cy,R-7,0,Math.PI*2);x.lineWidth=2;x.strokeStyle="rgba(255,255,255,.18)";x.stroke();
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.t--;x.globalAlpha=Math.max(0,p.t/25);x.beginPath();x.arc(p.x,p.y,2,0,7);x.fillStyle="#fff";x.fill()}x.globalAlpha=1;
 for(const b of balls)if(!b.dead){
  x.font=`${b.r*2}px "Arial"`;x.textAlign="center";x.textBaseline="middle";
  x.fillText(b.f,b.x,b.y);
 }
}
function loop(t){
 if(!running)return;
 let dt=Math.min((t-last)/16.67,2);last=t;elimClock+=dt;
 const alive=balls.filter(b=>!b.dead);
 for(const b of alive){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.998,dt);b.vy*=Math.pow(.998,dt);
  let dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy)||1;
  if(d+b.r>R){let nx=dx/d,ny=dy/d;b.x=cx+nx*(R-b.r);b.y=cy+ny*(R-b.r);
   let q=b.vx*nx+b.vy*ny;b.vx-=2*q*nx;b.vy-=2*q*ny;b.vx*=.99;b.vy*=.99;}
 }
 for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++)collide(alive[i],alive[j]);
 if(elimClock>2.2){elimClock=0;eliminate()}
 particles=particles.filter(p=>p.t>0);
 const n=balls.filter(b=>!b.dead).length;count.textContent=n>1?`FLAGS REMAINING: ${n}`:"";
 draw();
 if(n<=1){
  running=false;const b=balls.find(q=>!q.dead);const winnerFlag=b?b.f:"";
const winnerName=countryNames[winnerFlag]||"Winner";
recordElimination(b,1);
win.textContent="🏆 "+winnerName+" WINS!";
win.style.display="block";start.style.display="none";
beep(520,.22,.30);setTimeout(()=>beep(760,.25,.32),170);
setTimeout(()=>announceWinner(winnerFlag),350);
setTimeout(()=>newGame(),3500);
 }else requestAnimationFrame(loop);
}

// Unlock audio on the first natural screen interaction; after that all rounds stay automatic.
function unlockAudio(){ startAudio(); window.removeEventListener("pointerdown",unlockAudio); window.removeEventListener("touchstart",unlockAudio); }
window.addEventListener("pointerdown",unlockAudio,{passive:true});
window.addEventListener("touchstart",unlockAudio,{passive:true});
addEventListener("resize",resize);resize();draw();
setTimeout(()=>newGame(),500);
</script>
